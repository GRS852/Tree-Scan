name: green_tree
description: "Árvores mal localizadas também causam danos. Denuncie com uma foto"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.4
  provider: ^6.1.1
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  camera: 0.11.2
  permission_handler: ^12.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/logo.png
  remove_alpha_ios: true